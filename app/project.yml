name: Panels
options:
  bundleIdPrefix: ai.connectly
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: L3D88WYFSA
    CODE_SIGN_STYLE: Automatic
targets:
  Panels:
    type: application
    platform: iOS
    sources:
      - path: Panels
        excludes:
          - Content
      # Bundled as a folder reference so the content keeps its directory layout.
      - path: Panels/Content
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.connectly.panels
        CODE_SIGN_ENTITLEMENTS: Panels/Panels.entitlements
        PRODUCT_NAME: Panels
        INFOPLIST_KEY_CFBundleDisplayName: "Safety Atlas"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIBackgroundModes: audio
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
